slam_toolbox:
  ros__parameters:
    mode: mapping
    # A cell counts as occupied above this hit probability. slam_toolbox's default 0.1 turned
    # every person or object that stood in the lidar for a few scans into a permanent wall: on
    # 2026-11-27 the hallway in front of the robot was closed by such specks (each inflated by
    # the costmap's inscribed radius) and Nav2 could not plan 1 m ahead. 0.65 keeps real walls.
    occupancy_threshold: 0.65
    map_file_name: ""
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    scan_topic: /scan
    use_map_topic: true
    use_sim_time: false
    provide_odom_frame: false
    publish_tf: true
    map_update_interval: 0.3
    map_publish_period: 0.3
    use_scan_matching: true
    min_laser_range: 0.15
    max_laser_range: 5.0
    use_scan_barycenter: false
    minimum_time_interval: 0.0
    transform_publish_period: 0.05
    # map->odom is stamped (latest scan + transform_timeout). Scans arrive from the robot in bursts
    # with 1-3 s gaps (2026-11-15), and once a gap outlasts this value the transform falls behind
    # "now" and Nav2's lookups fail ("extrapolation into the future"). 4 s rode out the gaps seen from the
    # Ubuntu server; from the Mac (two WiFi hops, gaps to 2.5 s plus processing) the margin shrank to
    # 0.6 s and goals failed at start again, hence 8 s. map->odom changes slowly, so the age is harmless.
    transform_timeout: 8.0
    map_save_interval: 0.0
    resolution: 0.05
    chunk_processing_retries: 10
    use_pose_correction: true
    scan_queue_size: 30
    covariance_scale: 0.001
    predict_duration: 0.05
    throttle_scans: 1
    # 0.1 m / 0.1 rad (slam_toolbox defaults are 0.5): at 0.02 every creep near a goal triggered a scan
    # match and map->odom twitched 10-15 cm, so Nav2's goal kept moving under the robot (2026-11-24).
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    loop_search_maximum_distance: 3.0
    loop_search_maximum_angle: 0.785
    loop_match_search_radius: 0.5
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_chain_gap: 5
    loop_match_maximum_variance: 2.0
    loop_match_minimum_response_coarse: 0.25
    loop_match_minimum_response_fine: 0.40
