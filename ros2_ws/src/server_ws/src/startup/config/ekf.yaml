ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.3
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true
    permit_corrected_publication: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odometry: use velocities only (mecanum position drifts due to roller slip)
    # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /mecanum_drive_controller/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_rejection_threshold: 5.0

    # IMU: yaw rate only — gives EKF real data at startup before mecanum activates.
    # Position/orientation disabled to avoid gyro position drift.
    # Once mecanum comes up, EKF has both wheel vyaw and IMU vyaw; they cross-check.
    imu0: /imu/combined
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 5
    imu0_rejection_threshold: 3.0
