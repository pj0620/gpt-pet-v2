[project]
name = "gpt-pet-v2"
version = "0.1.0"
description = "A LLM Powered Pet that continuously explores, learns, and interacts with people and animals."
requires-python = ">=3.12"
dependencies = [
    "google-adk[mcp]>=2.9.2,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1",
]

[project.scripts]
gpt-pet = "gpt_pet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_pet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: drives the real ai2thor-mcp server (boots Unity) and calls Gemini",
]
