; Simulation profile: the brain drives the AI2-THOR simulator through ai2thor-mcp.
; Start the server first, from the ai2thor-mcp checkout:
;   uv run python/ai2thor_mcp/main.py --http --scene FloorPlan_Train1_3

[profile]
name = sim

[model]
goal_setter = gemini-3.5-flash
executor = gemini-3.5-flash
temperature = 0.2

[mcp]
transport = streamable_http
url = http://localhost:8000/mcp
connect_timeout_s = 30
read_timeout_s = 300
tool_list_cache_ttl_s = 600
tool_filter = get_current_view, set_nav_goal, get_nav_status, cancel_nav, list_destinations, get_map, do_move, do_rotate
; To let gpt-pet launch the simulator itself over stdio, replace the keys above with:
;   transport = stdio
;   command = uv
;   args = run python/ai2thor_mcp/main.py --scene FloorPlan_Train1_3
;   cwd = /Users/pj/Projects/GPTPet/code/gptpet-ws/ai2thor-mcp
;   timeout_s = 300
;   tool_filter = (same list as above)

[brain]
default_goal = explore your surroundings and find something interesting
max_llm_calls_per_tick = 40
goal_history_limit = 10
max_goal_attempts = 3
; testing knobs: wait after each tick that starts a new goal, and cap goals per run
goal_delay_s = 60
tick_delay_s = 0
max_goals_per_run = 10

; Per-tick call caps per tool. A call over its cap is refused with a "budget exhausted" message
; that tells the executor to stop and report. This bounds tick latency deterministically.
; get_nav_status: the model no longer polls (see [nav]); one stray check is allowed.
[tool_limits]
get_current_view = 4
set_nav_goal = 2
get_nav_status = 1
cancel_nav = 1
list_destinations = 1
get_map = 1
do_move = 3
do_rotate = 2

; Drives: set_nav_goal returns to the model only when the drive has ended (succeeded, failed or
; canceled). The brain checks get_nav_status itself every poll_interval_s, so no LLM calls are
; spent while the robot drives. After max_wait_s it stops waiting (the drive continues) and the
; executor reports the drive as ongoing.
[nav]
poll_interval_s = 0.5
max_wait_s = 120

; System 1: a local decision model takes the turns it can decide with confidence (looking,
; picking a destination, judging a goal still in progress); Gemini takes the rest and still
; writes every new goal. Needs Ollama >= 0.35 serving the model: `ollama pull nimble`.
; min_confidence: how decisive an answer must be (choices: 1 - normalized entropy; yes/no:
; |p(yes) - p(no)|, so 0.75 means p >= 0.875). Raise it for fewer, safer S1 turns.
[s1]
enabled = true
base_url = http://127.0.0.1:11434
model = nimble
min_confidence = 0.75
timeout_s = 30

; portal features; the free camera exists only in the simulator
[features]
free_camera = true
