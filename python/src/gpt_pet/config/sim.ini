; Simulation profile: the brain drives the AI2-THOR simulator through ai2thor-mcp.
; Start the server first, from the ai2thor-mcp checkout:
;   uv run python/ai2thor_mcp/main.py --http --scene FloorPlan_Train1_3
; ai2thor-mcp runs its navigation fixes by default (AI2THOR_MCP_FIXES=none turns them off).

[profile]
name = sim

; request_timeout_s: a Gemini call that takes longer fails (0 = wait forever). The executor then
; reports what it did so far, and the goal setter keeps an active goal; with no goal to keep, the
; tick fails and the loop retries after a short backoff.
[model]
goal_setter = gemini-3.5-flash
executor = gemini-3.5-flash
temperature = 0.2
request_timeout_s = 20

[mcp]
transport = streamable_http
url = http://localhost:8000/mcp
connect_timeout_s = 30
read_timeout_s = 300
tool_list_cache_ttl_s = 600
tool_filter = get_current_view, set_nav_goal, get_nav_status, cancel_nav, list_destinations, get_map, do_move, do_rotate, do_look
; To let gpt-pet launch the simulator itself over stdio, replace the keys above with:
;   transport = stdio
;   command = uv
;   args = run python/ai2thor_mcp/main.py --scene FloorPlan_Train1_3
;   cwd = /Users/pj/Projects/GPTPet/code/gptpet-ws/ai2thor-mcp
;   timeout_s = 300
;   tool_filter = (same list as above)

[brain]
default_goal = explore your surroundings and find something interesting
max_llm_calls_per_tick = 40
goal_history_limit = 10
max_goal_attempts = 4
; testing knobs: wait after each tick that starts a new goal, and cap goals per run
goal_delay_s = 60
tick_delay_s = 0
max_goals_per_run = 10
; places_memory: remember places across ticks and mark each view's destinations as here (within
; reach: a drive there goes nowhere), visited or failed; S1 then skips and ranks by the marks.
; map_for_goals: show Gemini the top-down map and (with places_memory) what the pet has done when
; it decides a goal; a goal may then name a remembered place as its target.
; On since the exploration experiment of 2026-10-01 (experiments/README.md, Findings): with S1 they
; raised the floor seen from about 70-80% to about 90% and halved the tokens per run.
places_memory = true
map_for_goals = true
; here_m: objects this close count as within reach. The simulator measures to an object's centre,
; and its planner already counts most objects within 2 m as reached (baseline runs, 2026-10-01).
here_m = 2.0
; failed_guard: views mark a destination failed_here when a drive to it already failed from where
; the robot stands, the executor refuses such a drive, and the goal setter's list puts failed
; places last. failure_guidance: the prompts say to back up or turn after a failed drive, and that
; one failed drive is no reason to abandon a goal. On since the fixes study of 2026-10-03
; (experiments/fixes): with unreliable navigation the guard halves the failed drives; the guidance
; cuts about a fifth of the cost.
failed_guard = true
failure_guidance = true

; Per-tick call caps per tool. A call over its cap is refused with a "budget exhausted" message
; that tells the executor to stop and report. This bounds tick latency deterministically.
; get_nav_status: the model no longer polls (see [nav]); one stray check is allowed.
[tool_limits]
get_current_view = 4
set_nav_goal = 2
get_nav_status = 1
cancel_nav = 1
list_destinations = 1
get_map = 1
do_move = 3
do_rotate = 2
do_look = 3

; Drives: set_nav_goal returns to the model only when the drive has ended (succeeded, failed or
; canceled). The brain checks get_nav_status itself every poll_interval_s, so no LLM calls are
; spent while the robot drives. After max_wait_s it stops waiting (the drive continues) and the
; executor reports the drive as ongoing.
[nav]
poll_interval_s = 0.5
max_wait_s = 120

; System 1: a local decision model takes the turns it can decide with confidence (looking,
; picking a destination, judging a goal still in progress); Gemini takes the rest and still
; writes every new goal. Needs Ollama >= 0.35 serving the model: `ollama pull nimble`.
; min_confidence: how decisive an answer must be (choices: 1 - normalized entropy; yes/no:
; |p(yes) - p(no)|, so 0.75 means p >= 0.875). Raise it for fewer, safer S1 turns.
; scan_rule: when a view offers nothing new to drive to, turn by rule; when the tick's looks run
; out, S1 writes the report itself instead of handing the turn to Gemini.
; explore_policy: drive to a goal's target first; on an explore goal, take unvisited passages, then
; the farthest unvisited objects (needs places_memory). Gemini still sets every goal.
[s1]
enabled = true
base_url = http://127.0.0.1:11434
model = nimble
min_confidence = 0.75
timeout_s = 30
scan_rule = true
explore_policy = true
; unstuck_rule: after two drives in a row failed without the robot moving, back up and turn around.
; explore_ticks: an explore goal goes on by rule for up to this many stretches while unvisited
; places remain (max_goal_attempts must leave room); an explore goal that reaches its last attempt
; still exploring counts as done. On since the fixes study of 2026-10-03 (experiments/fixes).
unstuck_rule = true
explore_ticks = 3

; portal features; the free camera exists only in the simulator
; People (gpt_pet.people; gptpet-plans: People Interaction, step 2). Off until the people
; experiments say otherwise. enabled: people are not places (no marks), the attention tools are
; shown to the executor, System 1 turns to a person who comes into view and hands the goal
; decision to the model, and the goal setter's prompt lists who was seen. watch: look for people
; every watch_every_s while driving (a person stops a drive that is not about them) and resting
; (a person wakes the pet). react_every_s: no second reaction to the same person sooner.
[people]
enabled = false
labels = Person
watch = true
watch_every_s = 1.5
react_every_s = 60
attention_wait_s = 15

[features]
free_camera = true
; attention: the portal shows the robot's attention (ai2thor-mcp set_attention tools).
attention = true
