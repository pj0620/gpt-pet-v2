; Real-robot profile: the brain drives the physical robot through gpt-pet-mcp.
; NOTE: gpt-pet-mcp does not expose an MCP server yet (it is a ROS 2 workspace). This profile
; defines the contract it must implement: the same tools as ai2thor-mcp, 1:1, at this URL.

[profile]
name = real

[model]
goal_setter = gemini-3.5-flash
executor = gemini-3.5-flash
temperature = 0.2

[mcp]
transport = streamable_http
url = http://pj-ubuntu.local:8000/mcp
connect_timeout_s = 10
read_timeout_s = 120
tool_list_cache_ttl_s = 600
tool_filter = get_current_view, set_nav_goal, get_nav_status, cancel_nav, list_destinations, get_map, do_move, do_rotate

[brain]
default_goal = explore your surroundings and find something interesting
max_llm_calls_per_tick = 40
goal_history_limit = 10
max_goal_attempts = 3
; testing knobs: wait after each tick that starts a new goal, and cap goals per run
goal_delay_s = 60
tick_delay_s = 0
max_goals_per_run = 10

; Per-tick call caps per tool. A call over its cap is refused with a "budget exhausted" message
; that tells the executor to stop and report. This bounds tick latency deterministically.
[tool_limits]
get_current_view = 4
set_nav_goal = 2
get_nav_status = 6
cancel_nav = 1
list_destinations = 1
get_map = 1
do_move = 3
do_rotate = 2

; portal features; the free camera exists only in the simulator
[features]
free_camera = false
